<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Katalog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #525659; font-family: Arial, sans-serif; overflow-x: hidden; }
    .top-bar {
      background: #333;
      color: #fff;
      padding: 0.8rem 1rem;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #c05a2a;
      color: #fff;
      border: none;
      cursor: pointer;
      padding: 0.6rem 1.6rem;
      font-size: 14px;
      border-radius: 3px;
    }
    .btn:hover { background: #a04820; }
    .btn:disabled { background: #666; cursor: default; }
    .page-info { font-size: 14px; color: #ccc; min-width: 120px; text-align: center; }
    .canvas-container {
      width: 100%;
      margin-top: 56px;
      display: flex;
      justify-content: center;
      min-height: calc(100vh - 56px);
    }
    canvas { max-width: 100%; display: block; }
    .error-msg {
      color: #fff;
      text-align: center;
      margin-top: 100px;
      font-size: 16px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn" id="prev-page">&#8592; Předchozí</button>
    <span class="page-info">Strana <span id="page-num">-</span> z <span id="page-count">-</span></span>
    <button class="btn" id="next-page">Další &#8594;</button>
  </div>

  <div class="canvas-container">
    <canvas id="pdf-render"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    // Nastavení worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Parametry z URL
    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file') || 'data';
    const pdfUrl = fileName + '.pdf';

    let pdfDoc = null;
    let pageNum = parseInt(urlParams.get('page')) || 1;
    let pageIsRendering = false;
    let pageNumIsPending = null;

    const canvas = document.getElementById('pdf-render');
    const ctx = canvas.getContext('2d');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const pageNumEl = document.getElementById('page-num');
    const pageCountEl = document.getElementById('page-count');

    // Vykreslení stránky
    function renderPage(num) {
      pageIsRendering = true;
      prevBtn.disabled = true;
      nextBtn.disabled = true;

      pdfDoc.getPage(num).then(function(page) {
        const containerWidth = window.innerWidth;
        const unscaledViewport = page.getViewport({ scale: 1 });
        const scale = containerWidth / unscaledViewport.width;
        const viewport = page.getViewport({ scale: scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
          pageIsRendering = false;
          prevBtn.disabled = (num <= 1);
          nextBtn.disabled = (num >= pdfDoc.numPages);

          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });

        pageNumEl.textContent = num;

        // Aktualizace URL
        const newUrl = '?file=' + fileName + '&page=' + num;
        window.history.replaceState({ path: newUrl }, '', newUrl);
      });
    }

    function queueRenderPage(num) {
      if (pageIsRendering) {
        pageNumIsPending = num;
      } else {
        renderPage(num);
      }
    }

    // Tlačítka
    prevBtn.addEventListener('click', function() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    nextBtn.addEventListener('click', function() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    // Responzivita
    window.addEventListener('resize', function() {
      if (pdfDoc) renderPage(pageNum);
    });

    // Načtení PDF
    pdfjsLib.getDocument(pdfUrl).promise.then(function(doc) {
      pdfDoc = doc;
      pageCountEl.textContent = pdfDoc.numPages;
      if (pageNum > pdfDoc.numPages) pageNum = 1;
      renderPage(pageNum);
    }).catch(function(err) {
      console.error(err);
      var container = document.querySelector('.canvas-container');
      var div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = 'Soubor "' + pdfUrl + '" nebyl nalezen nebo jej nelze načíst.';
      container.appendChild(div);
    });
  </script>
</body>
</html>
