<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Ivpeko</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    body { margin: 0; background: #e9e9e9; font-family: Arial, sans-serif; }
    #wrap { padding: 16px 8px 90px; display: flex; justify-content: center; }
    #stage { position: relative; display: inline-block; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    canvas { display: block; }
    #layer { position: absolute; inset: 0; }
    .hotspot { position: absolute; display: block; border-radius: 3px; transition: background .15s; }
    .hotspot:hover { background: rgba(76,175,80,.25); outline: 2px solid #4CAF50; }
    body.edit .hotspot { background: rgba(255,152,0,.25); outline: 2px dashed #ff9800; cursor: not-allowed; }
    .draft { position: absolute; border: 2px dashed #2196F3; background: rgba(33,150,243,.2); pointer-events: none; }
    .bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85);
           padding: 8px 16px; border-radius: 20px; display: flex; gap: 10px; align-items: center; z-index: 10; }
    .bar button { padding: 8px 14px; border: 0; border-radius: 5px; background: #4CAF50; color: #fff; cursor: pointer; }
    .bar button:disabled { background: #888; cursor: default; }
    #info { color: #fff; min-width: 70px; text-align: center; }
    #msg { text-align: center; color: #c62828; padding: 40px; }
    #editHint { display: none; position: fixed; top: 10px; left: 10px; background: #ff9800; color: #000;
                padding: 8px 12px; border-radius: 5px; font-size: 13px; z-index: 10; }
    body.edit #editHint { display: block; }
</style>
</head>
<body>
<div id="editHint">REŽIM ÚPRAV: tažením myši nakreslete oblast, pak zadejte URL. Kliknutím na oranžovou oblast ji smažete.</div>
<div id="wrap"><div id="stage"><canvas id="c"></canvas><div id="layer"></div></div></div>
<div id="msg"></div>

<div class="bar">
    <button id="prev">←</button>
    <span id="info"></span>
    <button id="next">→</button>
    <button id="export" style="display:none">Exportovat odkazy (JSON)</button>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const file   = params.get('file');            // např. boxy/Qbrick_System_USER_MAP_BLK_RED_2026_01
let page     = parseInt(params.get('page')) || 1;
const edit   = params.get('edit') === '1';    // přidejte &edit=1 pro editor

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const layer  = document.getElementById('layer');
const msg    = document.getElementById('msg');

let pdf = null, links = {}, rendering = false, pending = null;

if (edit) {
    document.body.classList.add('edit');
    document.getElementById('export').style.display = '';
}

async function init() {
    if (!file) { msg.textContent = 'Chybí parametr ?file=...'; return; }
    try {
        pdf = await pdfjsLib.getDocument(file + '.pdf').promise;
    } catch (e) {
        msg.textContent = 'PDF se nepodařilo načíst: ' + file + '.pdf';
        return;
    }
    // Odkazy leží vedle PDF: stejný název + .links.json
    try {
        const r = await fetch(file + '.links.json');
        if (r.ok) links = await r.json();
    } catch (e) { /* bez odkazů */ }
    page = Math.min(Math.max(page, 1), pdf.numPages);
    render(page);
}

async function render(num) {
    if (rendering) { pending = num; return; }
    rendering = true;
    const p = await pdf.getPage(num);
    const base = p.getViewport({ scale: 1 });
    const cssWidth = Math.min(window.innerWidth - 16, 1000);
    const cssScale = cssWidth / base.width;
    const dpr = window.devicePixelRatio || 1;
    const vp = p.getViewport({ scale: cssScale * dpr });
    canvas.width = vp.width;
    canvas.height = vp.height;
    canvas.style.width = cssWidth + 'px';
    canvas.style.height = (vp.height / dpr) + 'px';
    await p.render({ canvasContext: ctx, viewport: vp }).promise;
    rendering = false;

    drawLinks();
    document.getElementById('info').textContent = num + ' / ' + pdf.numPages;
    document.getElementById('prev').disabled = num <= 1;
    document.getElementById('next').disabled = num >= pdf.numPages;
    params.set('page', num);
    history.replaceState(null, '', '?' + params.toString());

    if (pending !== null) { const n = pending; pending = null; render(n); }
}

function drawLinks() {
    layer.innerHTML = '';
    (links[page] || []).forEach((l, i) => {
        const a = document.createElement('a');
        a.className = 'hotspot';
        a.style.left = l.x + '%';  a.style.top = l.y + '%';
        a.style.width = l.w + '%'; a.style.height = l.h + '%';
        a.title = l.url;
        if (edit) {
            a.href = '#';
            a.onclick = ev => {
                ev.preventDefault(); ev.stopPropagation();
                if (confirm('Smazat tuto oblast?\n' + l.url)) { links[page].splice(i, 1); drawLinks(); }
            };
        } else {
            a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
        }
        layer.appendChild(a);
    });
}

// ---------- Editor ----------
if (edit) {
    let start = null, draft = null;
    layer.addEventListener('mousedown', e => {
        if (e.target !== layer) return;
        const r = layer.getBoundingClientRect();
        start = { x: e.clientX - r.left, y: e.clientY - r.top, r };
        draft = document.createElement('div'); draft.className = 'draft'; layer.appendChild(draft);
    });
    window.addEventListener('mousemove', e => {
        if (!start) return;
        const x = e.clientX - start.r.left, y = e.clientY - start.r.top;
        Object.assign(draft.style, {
            left: Math.min(x, start.x) + 'px', top: Math.min(y, start.y) + 'px',
            width: Math.abs(x - start.x) + 'px', height: Math.abs(y - start.y) + 'px'
        });
    });
    window.addEventListener('mouseup', e => {
        if (!start) return;
        const r = start.r;
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const box = {
            x: Math.min(x, start.x) / r.width * 100, y: Math.min(y, start.y) / r.height * 100,
            w: Math.abs(x - start.x) / r.width * 100, h: Math.abs(y - start.y) / r.height * 100
        };
        draft.remove(); start = null; draft = null;
        if (box.w < 1 || box.h < 1) return;
        const url = prompt('URL odkazu (např. https://www.ivpeko.cz/...):');
        if (!url) return;
        Object.keys(box).forEach(k => box[k] = +box[k].toFixed(2));
        box.url = url;
        (links[page] = links[page] || []).push(box);
        drawLinks();
    });
    document.getElementById('export').onclick = () => {
        const json = JSON.stringify(links, null, 2);
        navigator.clipboard.writeText(json).then(
            () => alert('JSON zkopírován. Uložte ho jako ' + file.split('/').pop() + '.links.json vedle PDF.'),
            () => prompt('Zkopírujte JSON:', json)
        );
    };
}

// ---------- Navigace ----------
const go = n => { if (pdf && n >= 1 && n <= pdf.numPages) { page = n; render(n); } };
document.getElementById('prev').onclick = () => go(page - 1);
document.getElementById('next').onclick = () => go(page + 1);
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(page - 1);
    if (e.key === 'ArrowRight') go(page + 1);
});
let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => pdf && render(page), 200); });

init();
</script>
</body>
</html>
